# RAG 知识库 / Java 程序员智能面试助手 - Docker Compose 部署
# 服务组成：
#   rag-app   : FastAPI 应用（构建自本目录 Dockerfile）
#   redis     : 会话/缓存存储（compose 内置，避免占用宿主机 6379）
# 说明：
#   - data 目录通过 volume 挂载持久化（FAISS/BM25/SQLite/知识库），容器删除不丢数据
#   - env_file 读取 .env 注入 LLM/Embedding API Key 等敏感配置
#   - 应用单 worker 运行，符合项目单进程约束

services:
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-knowledge-assistant-app
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口，如有冲突可改左侧端口
      - "8000:8000"
    environment:
      # 指向 compose 内置 redis 服务，而非默认的 192.168.127.101
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_PASSWORD: ""
    env_file:
      # 存放 BAILIAN_API_KEY / SILICONFLOW_API_KEY 等真实密钥
      - .env
    volumes:
      # 持久化知识库与检索索引（构建时不入镜像，运行期挂载）
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: rag-knowledge-assistant-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data: