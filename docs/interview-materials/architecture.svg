<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7fb"/>
      <stop offset="1" stop-color="#eef0f7"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c46d8"/><stop offset="1" stop-color="#7b6ff2"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="960" height="720" fill="url(#bg)"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="url(#title)">RAG 知识库 · Java 程序员智能面试助手 — 系统架构</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#8a8fa3">Interview RAG · FastAPI + FAISS + Redis + LLM</text>

  <!-- 顶部：消费者 -->
  <rect x="40" y="80" width="260" height="86" rx="10" fill="#ffffff" stroke="#d0d4e4"/>
  <text x="170" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">前端 SPA（原生 JS）</text>
  <text x="170" y="126" text-anchor="middle" font-size="11" fill="#666">问答 / AI面试 / 复习 / 设置</text>
  <text x="170" y="142" text-anchor="middle" font-size="11" fill="#666">SSE 流式 ·可滚动 · 会话管理</text>

  <rect x="360" y="80" width="250" height="86" rx="10" fill="#ffffff" stroke="#d0d4e4"/>
  <text x="485" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">API 层（app/api）</text>
  <text x="485" y="126" text-anchor="middle" font-size="11" fill="#666">/api/query · /stream · /interview</text>
  <text x="485" y="142" text-anchor="middle" font-size="11" fill="#666">/auth(JWT) · /eval · /files · /sessions</text>

  <rect x="670" y="80" width="250" height="86" rx="10" fill="#ffffff" stroke="#d0d4e4"/>
  <text x="795" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">统一异常 / 鉴权 / 限流</text>
  <text x="795" y="126" text-anchor="middle" font-size="11" fill="#666">get_current_user (JWT)</text>
  <text x="795" y="142" text-anchor="middle" font-size="11" fill="#666">rate_limiter · exceptions 映射</text>

  <!-- 服务层容器 -->
  <rect x="40" y="220" width="880" height="180" rx="12" fill="#ffffff" fill-opacity="0.5" stroke="#c3c9de" stroke-dasharray="5 4"/>
  <text x="58" y="244" font-size="13" font-weight="bold" fill="#7b6ff2">服务层（app/services）</text>

  <!-- 核心：统一检索门面（高亮） -->
  <rect x="70" y="256" width="300" height="120" rx="12" fill="#7b6ff2"/>
  <text x="220" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">⭐ 统一检索门面 RetrievalFacade</text>
  <text x="220" y="304" text-anchor="middle" font-size="11" fill="#efeAff">query rewrite → hybrid(RRF) → rerank → parent</text>
  <text x="220" y="322" text-anchor="middle" font-size="11" fill="#efeAff">问答与面试共用 · 失败降级 · 不碰缓存</text>
  <text x="220" y="340" text-anchor="middle" font-size="11" fill="#efeAff">Part A 消融已验证的管线</text>
  <text x="220" y="362" text-anchor="middle" font-size="10" fill="#d9d3ff">(Part B 核心成果)</text>

  <!-- 检索组件 -->
  <rect x="420" y="256" width="120" height="44" rx="8" fill="#eef0fb" stroke="#7b6ff2"/>
  <text x="480" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">HybridRetriever</text>
  <text x="480" y="292" text-anchor="middle" font-size="10" fill="#666">FAISS + 稀疏 · RRF k=60</text>

  <rect x="420" y="312" width="120" height="44" rx="8" fill="#eef0fb" stroke="#7b6ff2"/>
  <text x="480" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">RerankService</text>
  <text x="480" y="348" text-anchor="middle" font-size="10" fill="#666">SiliconFlow 精排</text>

  <rect x="560" y="256" width="120" height="44" rx="8" fill="#eef0fb" stroke="#7b6ff2"/>
  <text x="620" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">QueryRewrite</text>
  <text x="620" y="292" text-anchor="middle" font-size="10" fill="#666">背景改写 ·开关</text>

  <rect x="560" y="312" width="120" height="44" rx="8" fill="#eef0fb" stroke="#7b6ff2"/>
  <text x="620" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">LLMClient / Embedding</text>
  <text x="620" y="348" text-anchor="middle" font-size="10" fill="#666">qwen-turbo · Qwen3</text>

  <rect x="700" y="256" width="190" height="100" rx="10" fill="#ffffff" stroke="#d0d4e4"/>
  <text x="795" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">业务服务</text>
  <text x="795" y="298" text-anchor="middle" font-size="10" fill="#666">RAGService（问答/SSE 流式）</text>
  <text x="795" y="314" text-anchor="middle" font-size="10" fill="#666">InterviewService（AI 面试）</text>
  <text x="795" y="330" text-anchor="middle" font-size="10" fill="#666">EvaluationService（评测）</text>
  <text x="795" y="346" text-anchor="middle" font-size="10" fill="#666">cache / eval_monitor / session_cost</text>

  <!-- 连接：业务服务→facade -->
  <line x1="640" y1="296" x2="372" y2="300" stroke="#7b6ff2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 存储层容器 -->
  <rect x="40" y="450" width="880" height="150" rx="12" fill="#ffffff" fill-opacity="0.5" stroke="#c3c9de" stroke-dasharray="5 4"/>
  <text x="58" y="474" font-size="13" font-weight="bold" fill="#2f6f4f">存储层（app/storage）</text>

  <rect x="70" y="488" width="150" height="92" rx="8" fill="#ffffff" stroke="#d0d4e4"/>
  <text x="145" y="512" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">FaissStore</text>
  <text x="145" y="528" text-anchor="middle" font-size="10" fill="#666">FAISS 向量</text>
  <text x="145" y="543" text-anchor="middle" font-size="10" fill="#666">(flat/HNSW)</text>
  <text x="145" y="558" text-anchor="middle" font-size="10" fill="#666">读写锁·重复</text>

  <rect x="240" y="488" width="150" height="92" rx="8" fill="#ffffff" stroke="#d0d4e4"/>
  <text x="315" y="512" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">SparseRetriever</text>
  <text x="315" y="528" text-anchor="middle" font-size="10" fill="#666">BM25/Whoosh/SQLite</text>
  <text x="315" y="543" text-anchor="middle" font-size="10" fill="#666">降级链 memory</text>

  <rect x="410" y="488" width="150" height="92" rx="8" fill="#ffffff" stroke="#d0d4e4"/>
  <text x="485" y="512" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">SessionStore</text>
  <text x="485" y="528" text-anchor="middle" font-size="10" fill="#666">Redis 会话·TTL 1h</text>
  <text x="485" y="543" text-anchor="middle" font-size="10" fill="#666">20 轮历史</text>

  <rect x="580" y="488" width="150" height="92" rx="8" fill="#ffffff" stroke="#d0d4e4"/>
  <text x="655" y="512" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">SearchStore</text>
  <text x="655" y="528" text-anchor="middle" font-size="10" fill="#666">SQLite 历史持久</text>
  <text x="655" y="543" text-anchor="middle" font-size="10" fill="#666">用户长期记忆</text>

  <rect x="750" y="488" width="150" height="92" rx="8" fill="#ffffff" stroke="#d0d4e4"/>
  <text x="825" y="512" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">DocStore / 其它</text>
  <text x="825" y="528" text-anchor="middle" font-size="10" fill="#666">InterviewStore</text>
  <text x="825" y="543" text-anchor="middle" font-size="10" fill="#666">UserStore</text>

  <!-- 服务→存储线 -->
  <line x1="270" y1="376" x2="145" y2="486" stroke="#9aa2bd" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="376" x2="315" y2="486" stroke="#9aa2bd" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="376" x2="485" y2="486" stroke="#9aa2bd" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="376" x2="655" y2="486" stroke="#9aa2bd" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 外部服务 -->
  <rect x="40" y="638" width="880" height="66" rx="10" fill="#ffffff" fill-opacity="0.6" stroke="#c3c9de"/>
  <text x="58" y="662" font-size="12" font-weight="bold" fill="#444">外部依赖</text>
  <text x="58" y="682" font-size="10" fill="#666">阿里云百炼（LLM 生成） · 硅基流动（Embedding/Rerank） · Redis · 可选 OTel/Grafana（可观测性）</text>
  <text x="700" y="682" font-size="10" fill="#666">单 worker 部署 · Docker compose</text>

  <!-- API→服务 线 -->
  <line x1="485" y1="166" x2="220" y2="254" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>